<!DOCTYPE html>
<html>
<head>
    <title>Book Management System</title>
</head>
<body>
    <h2>Book List</h2>
    <a href="{% url 'book_create' %}">Add New Book</a>
    <table border="1" cellpadding="5" cellspacing="0" style="margin-top: 15px;">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>₹{{ book.price }}</td>
                <td>
                    <a href="{% url 'book_update' book.pk %}">Edit</a> | 
                    <a href="{% url 'book_delete' book.pk %}">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No books found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
